name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backend
        run: npm test
      - name: Check JS syntax
        run: |
          node --check public/assets/app.js
          node --check public/assets/catalog.js
          node --check public/assets/videos.js
          find functions -name '*.js' -type f -exec node --check {} \;
      - name: Regenerate site from editable content
        run: python3 build_site.py
      - name: Check static links and metadata
        run: python tests/static_audit.py
      - name: Check Python generator
        run: python -m py_compile build_site.py course_platform.py
