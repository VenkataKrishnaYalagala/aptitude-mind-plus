# Pages CMS: sign in at https://app.pagescms.org with your GitHub account.
# Public learning content belongs in GitHub, never API credentials or student records.
media:
  input: public/media
  output: /media
  extensions: [png, jpg, jpeg, webp, svg]
  rename: safe
content:
  - name: site
    label: Website settings and homepage
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero_kicker
        label: Small headline
        type: string
      - name: hero_title
        label: Main headline
        type: string
      - name: hero_description
        label: Homepage introduction
        type: text
      - name: support_price
        label: Tutoring programme price (INR)
        type: number
        options:
          min: 0
      - name: support_description
        label: Tutoring description
        type: text
      - name: youtube_channel_url
        label: YouTube channel address
        type: string
      - name: contact_email
        label: Public contact email (optional)
        type: string
      - name: logo_path
        label: Official brand logo (optional)
        type: image
  - name: courses
    label: Exam pathways
    type: file
    path: content/courses.json
    format: json
    list: true
    fields:
      - name: key
        label: Exam code (do not change after publishing)
        type: select
        options:
          values: [upsc, gate, ssc, bank, state, rail]
      - name: name
        type: string
      - name: short
        type: string
      - name: symbol
        type: string
      - name: title
        type: string
      - name: summary
        type: text
      - name: level
        type: string
      - name: cover_image
        label: Optional cover image
        type: image
      - name: focus
        type: string
        list: true
      - name: outcomes
        type: string
        list: true
      - name: modules
        type: object
        list: true
        fields:
          - name: heading
            type: string
          - name: topics
            type: string
            list: true
  - name: lessons
    label: Free lessons and YouTube videos
    type: file
    path: content/lessons.json
    format: json
    list: true
    fields:
      - name: slug
        label: Unique lesson identifier
        type: string
        pattern: "^[a-z0-9-]+$"
      - name: title
        type: string
      - name: summary
        type: text
      - name: exam
        type: select
        options:
          values: [all, upsc, gate, ssc, bank, state, rail]
      - name: topic
        type: string
      - name: notes
        label: Lesson notes shown below the video
        type: text
      - name: youtube_url
        label: Public YouTube video URL (optional)
        type: string
      - name: cover_image
        label: Optional thumbnail image
        type: image
      - name: link
        label: Optional local lesson URL
        type: string
      - name: published
        type: boolean
  - name: updates
    label: Announcement strip
    type: file
    path: content/updates.json
    format: json
    list: true
    fields:
      - name: title
        type: string
      - name: url
        label: Link to an internal page
        type: string
      - name: published
        type: boolean

  - name: social
    label: Social accounts and community text
    type: file
    path: content/social.json
    format: json
    fields:
      - name: youtube_url
        label: YouTube channel URL
        type: string
      - name: instagram_url
        label: Official Instagram profile URL (leave blank until verified)
        type: string
      - name: facebook_url
        label: Official Facebook Page URL (leave blank until verified)
        type: string
      - name: section_heading
        label: Social section headline
        type: string
      - name: section_description
        label: Social section description
        type: text
  - name: social_posts
    label: Public social posts to feature
    type: file
    path: content/social-posts.json
    format: json
    list: true
    fields:
      - name: platform
        label: Social platform
        type: select
        options:
          values: [youtube, instagram, facebook]
      - name: title
        label: Title shown on website
        type: string
      - name: summary
        label: Short summary
        type: text
      - name: source_url
        label: Verified original public post link
        type: string
      - name: published
        label: Feature this post
        type: boolean
  - name: feedback
    label: Learner comments (permission required)
    type: file
    path: content/feedback.json
    format: json
    list: true
    fields:
      - name: quote
        label: Exact genuine comment (no paraphrased testimonials)
        type: text
      - name: display_name
        label: Name approved for public display
        type: string
      - name: platform
        type: select
        options:
          values: [youtube, instagram, facebook]
      - name: source_url
        label: Original public comment/post link
        type: string
      - name: permission_confirmed
        label: The author explicitly agreed to this use
        type: boolean
      - name: approved
        label: You have reviewed and approved it
        type: boolean
  - name: materials
    label: Free and optional paid study materials
    type: file
    path: content/materials.json
    format: json
    list: true
    fields:
      - name: slug
        label: Unique resource identifier
        type: string
      - name: title
        type: string
      - name: summary
        type: text
      - name: exam
        type: select
        options:
          values: [all, upsc, gate, ssc, bank, state, rail]
      - name: kind
        label: Type (notes, workbook, practice)
        type: string
      - name: access
        label: Free or Paid
        type: select
        options:
          values: [free, paid]
      - name: status
        label: Availability
        type: select
        options:
          values: [available, planned]
      - name: href
        label: Internal free resource page (do not link paid file)
        type: string
      - name: price_inr
        label: Price in INR (premium only; optional)
        type: number
      - name: published
        label: Display in catalog
        type: boolean
